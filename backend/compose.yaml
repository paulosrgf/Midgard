services:
    app:
        build:
            context: .
            dockerfile: Dockerfile.dev
        ports:
            - "8000:8000"
        volumes:
            - .:/var/www
        depends_on:
            - db

    db:
        image: mysql:8.0
        ports:
            - "3306:3306"
        environment:
            MYSQL_DATABASE: midgard_db
            MYSQL_ROOT_PASSWORD: root
            MYSQL_USER: devuser
            MYSQL_PASSWORD: devpassword
        volumes:
            - db_data:/var/lib/mysql

volumes:
    db_data:
